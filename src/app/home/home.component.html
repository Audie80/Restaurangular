<mat-card class="example-card" appearance="outlined">
    <mat-card-title>Développeuses et développeurs : à table !</mat-card-title>
    <mat-card-subtitle>Qui mange bien code mieux</mat-card-subtitle>
    <img mat-card-image [src]="plate">
    <mat-card-content>
        Entre deux séances de dev : un bon plat et une bonne boisson s'imposent.
        Qu'il s'agisse de manger sur le pouce et de prendre le temps, la "Tablée du développeur" saura vous satisfaire.
    </mat-card-content>
</mat-card>
